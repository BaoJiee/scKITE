[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sckite"
version = "0.1.0"
description = "Knowledge-integrated Transformer models for single-cell transcriptomics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "mosaicml-streaming>=0.11",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "torch==2.10.0",
    "tqdm>=4.66",
    "transformers>=4.40",
]

[project.urls]
Homepage = "https://github.com/BaoJiee/scKITE"
Repository = "https://github.com/BaoJiee/scKITE"
Paper = "https://arxiv.org/abs/2609.14970"
Issues = "https://github.com/BaoJiee/scKITE/issues"

[project.optional-dependencies]
tracking = [
    "wandb>=0.17",
]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "seaborn>=0.13",
    "umap-learn>=0.5.6",
]
downstream = [
    "dcor>=0.6",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "pandas>=2.2",
    "requests>=2.31",
    "scanpy>=1.10",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "seaborn>=0.13",
    "torch-geometric>=2.5",
    "umap-learn>=0.5.6",
]
dev = [
    "nbformat>=5.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["sckite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
